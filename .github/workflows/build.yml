name: build

# 触发：push dev/main、v* tag（出 Release）、PR、手动
on:
  push:
    # ci/** 分支用来单独验证 workflow 改动，验证完再并回 dev。
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      macos_only:
        description: 'Run only the macOS job'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  source:
    name: resolve native source
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        name: Require exact backend commit
        run: |
          ref="$(tr -d '\r\n' < tool/esurfing_c.ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected a full backend commit SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

  # ── 静态检查与单测（纯 Dart，跑一份就够）
  check:
    name: analyze & test
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.macos_only == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Dart native hook compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgtk-3-dev libx11-dev libxi-dev pkg-config
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ── Windows x64：MinGW 编 esurfing.dll → flutter build windows → zip
  windows:
    name: windows x64
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.macos_only == true) }}
    needs: source
    runs-on: windows-latest
    env:
      ESURFING_C_REF: ${{ needs.source.outputs.ref }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 精确提交与脚本共同决定原生缓存。
      - name: 还原 esurfing.dll 缓存
        id: native
        uses: actions/cache@v4
        with:
          path: packages/esurfing_native/windows
          key: esf-dll-${{ runner.os }}-${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}-${{ env.ESURFING_C_REF }}-${{ hashFiles('tool/build_native.sh') }}

      # 私有库鉴权：PAT 需要 Contents:Read-only；
      # Deploy Key 由 checkout 的 ssh-key 参数启用，repository 始终填 owner/repo。
      - name: 拉取 esurfing_c（精确提交）
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}
          ref: ${{ env.ESURFING_C_REF }}
          path: esurfing_c
          token: ${{ secrets.ESURFING_C_TOKEN || secrets.PAT_TOKEN }}
          ssh-key: ${{ secrets.ESURFING_C_DEPLOY_KEY }}
          submodules: recursive

      - name: Validate backend checkout
        if: steps.native.outputs.cache-hit != 'true'
        shell: bash
        run: test "$(git -C esurfing_c rev-parse HEAD)" = "$ESURFING_C_REF"

      # esurfing_c 是 C++23 + MinGW 专用链接参数，不能拿 MSVC 编，所以用 MSYS2 工具链。
      - name: 安装 MSYS2 MinGW 工具链
        if: steps.native.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja

      - name: 构建 esurfing.dll
        if: steps.native.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          ESURFING_C_DIR: ${{ github.workspace }}/esurfing_c
          ESURFING_BUILD_BASE: ${{ runner.temp }}/esf-build
        run: bash tool/build_native.sh windows

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 构建并打包
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          $out = 'build\windows\x64\runner\Release'
          @("app_sha=$env:GITHUB_SHA", "backend_sha=$env:ESURFING_C_REF", "architecture=x86_64", "mode=release", "signing=unsigned") | Set-Content "$out\build-source.txt"
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$out\*" -DestinationPath "dist\esurfing-app-windows-x64-$version.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  # ── Android：用同一个 C 库版本编三个 ABI 的 so，再打 APK
  android:
    name: android apk
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.macos_only == true) }}
    needs: source
    runs-on: ubuntu-latest
    env:
      ESURFING_C_REF: ${{ needs.source.outputs.ref }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 只有约 14 GB 可用磁盘，预装镜像里 dotnet/ghc/CodeQL/旧 NDK 等
      # 就占了 20 GB+。这套流程要 Flutter SDK + Gradle 缓存 + NDK + 三个 ABI 的 so
      # 与 APK 中间产物，磁盘一满 runner 连日志都写不出来（报错在 _diag 里，
      # GitHub 上表现为「job 失败且整段日志缺失」）。所以先把用不到的预装件删掉。
      - name: 腾出磁盘空间
        run: |
          echo "== before =="; df -h / /mnt 2>/dev/null | sed -n '1,5p'
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator
          docker image prune -af >/dev/null 2>&1 || true
          echo "== after =="; df -h / /mnt 2>/dev/null | sed -n '1,5p'

      - name: 还原 libesurfing.so 缓存
        id: native
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: esf-so-${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}-${{ env.ESURFING_C_REF }}-${{ hashFiles('tool/build_native.sh') }}

      - name: 拉取 esurfing_c（精确提交）
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}
          ref: ${{ env.ESURFING_C_REF }}
          path: esurfing_c
          token: ${{ secrets.ESURFING_C_TOKEN || secrets.PAT_TOKEN }}
          ssh-key: ${{ secrets.ESURFING_C_DEPLOY_KEY }}
          submodules: recursive

      - name: Validate backend checkout
        if: steps.native.outputs.cache-hit != 'true'
        run: test "$(git -C esurfing_c rev-parse HEAD)" = "$ESURFING_C_REF"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NDK 交给现成 action（r28c = 28.2.13676358，与 tool/build_native.sh 默认值一致）；
      # platform / build-tools 缺了由 Gradle 自动下载。
      - name: 安装 NDK
        if: steps.native.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false

      - name: 构建三个 ABI 的 libesurfing.so
        if: steps.native.outputs.cache-hit != 'true'
        env:
          ESURFING_C_DIR: ${{ github.workspace }}/esurfing_c
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash tool/build_native.sh android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 还原 release 签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # 固定密钥：任何机器上打出来的包签名一致，否则换机器后升级装不上。
          # 只在打 tag 出 Release 时强制要求；日常 push/PR 缺 Secrets 就退回 debug 签名，
          # 免得没配密钥前整条流水线一直是红的。
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            if [ "$REF_TYPE" = tag ]; then
              echo "::error::发版必须用固定密钥，但缺少 Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"
              echo "在本地运行 tool/android_signing.sh export 生成这两个值并填进仓库 Secrets"
              exit 1
            fi
            echo "::warning::缺少签名 Secrets，本次 APK 将使用 debug 签名（不影响发版流程之外的使用）"
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=esurfing"
            echo "keyPassword=$STORE_PASSWORD"
          } > android/key.properties

      - name: 构建并打包 APK
        run: |
          df -h / | tail -1
          flutter pub get
          flutter build apk --release
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/esurfing-app-android-$version.apk"
          printf 'app_sha=%s\nbackend_sha=%s\narchitecture=arm64-v8a,armeabi-v7a,x86_64\nmode=release\n' "$GITHUB_SHA" "$ESURFING_C_REF" > dist/android-build-source.txt
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$apksigner" verify --print-certs "dist/esurfing-app-android-$version.apk" > dist/android-signing.txt
          head -4 dist/android-signing.txt
          ls -l dist/
          df -h / | tail -1

      - name: Android lint and behavior tests
        working-directory: android
        run: ./gradlew :app:lintRelease :app:testDebugUnitTest --console=plain --max-workers=2

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            build/app/reports/lint-results-*.*
            build/app/reports/tests/testDebugUnitTest/
            build/app/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            dist/*.apk
            dist/android-build-source.txt
            dist/android-signing.txt
          if-no-files-found: error

  macos:
    name: macOS universal
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.macos_only == true }}
    needs: source
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ESURFING_C_REF: ${{ needs.source.outputs.ref }}
      ESURFING_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify macOS SDK
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk%%.*}" -ge 26 || { echo "::error::connectivity_plus requires the macOS 26 SDK"; exit 1; }
      - name: Checkout exact backend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}
          ref: ${{ env.ESURFING_C_REF }}
          path: esurfing_c
          token: ${{ secrets.ESURFING_C_TOKEN || secrets.PAT_TOKEN }}
          ssh-key: ${{ secrets.ESURFING_C_DEPLOY_KEY }}
          submodules: recursive
      - name: Validate backend checkout
        run: test "$(git -C esurfing_c rev-parse HEAD)" = "$ESURFING_C_REF"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Use CocoaPods for macOS plugins
        run: flutter config --no-enable-swift-package-manager
      - name: Restore universal macOS backend
        id: native
        uses: actions/cache@v4
        with:
          path: packages/esurfing_native/macos
          key: esf-macos-${{ runner.os }}-${{ env.ESURFING_C_REF }}-${{ hashFiles('tool/build_native.sh') }}
      - name: Build universal backend
        env:
          ESURFING_C_DIR: ${{ github.workspace }}/esurfing_c
          ESURFING_BUILD_BASE: ${{ runner.temp }}/esf-build
        if: steps.native.outputs.cache-hit != 'true'
        run: bash tool/build_native.sh macos
      - name: Validate universal macOS backend
        run: |
          test -f packages/esurfing_native/macos/libesurfing.dylib
          test "$(tr -d '\r\n' < packages/esurfing_native/macos/backend-sha.txt)" = "$ESURFING_C_REF"
      - name: Analyze and test on macOS
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: macOS plugin and desktop integration
        continue-on-error: true
        env:
          ARCHS: arm64
          ONLY_ACTIVE_ARCH: YES
        run: flutter test integration_test/macos_desktop_test.dart -d macos
      - name: Verify and package
        run: bash tool/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.zip
          if-no-files-found: error

  # ── 仅 tag 发布；ci/** 分支只上传 Actions 产物，不创建 Release
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || inputs.macos_only != true)
    needs: [check, windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # release job 没有 checkout（只下载产物），gh 找不到本地 git 仓库会直接
      # 报 fatal: not a git repository，所以每条命令都显式给 --repo。
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi

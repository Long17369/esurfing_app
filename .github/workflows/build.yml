name: build

# 触发：push dev/main、v* tag（出 Release）、PR、手动
on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'
  # 绑定的 C 库版本：必须是 tag。App 内置的 jniLibs / DLL 都来自这一版。
  ESURFING_C_REF: ${{ vars.ESURFING_C_REF || 'v1.2.1' }}

jobs:
  # ── 静态检查与单测（纯 Dart，跑一份就够）
  check:
    name: analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ── Windows x64：MinGW 编 esurfing.dll → flutter build windows → zip
  windows:
    name: windows x64
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 原生库只在 C 库 tag 或构建脚本变化时重编，其余命中缓存直接跳过整套工具链。
      - name: 还原 esurfing.dll 缓存
        id: native
        uses: actions/cache@v4
        with:
          path: packages/esurfing_native/windows
          key: esf-dll-${{ runner.os }}-${{ env.ESURFING_C_REF }}-${{ hashFiles('tool/build_native.sh') }}

      # 私有库鉴权：PAT 需要 Contents:Read-only；
      # 想用 Deploy Key 就把 ESURFING_C_REPO 写成 git@github.com:<owner>/esurfing_c.git。
      - name: 拉取 esurfing_c（绑定 tag）
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}
          ref: ${{ env.ESURFING_C_REF }}
          path: esurfing_c
          token: ${{ secrets.ESURFING_C_TOKEN || secrets.PAT_TOKEN }}
          ssh-key: ${{ secrets.ESURFING_C_DEPLOY_KEY }}

      # esurfing_c 是 C++23 + MinGW 专用链接参数，不能拿 MSVC 编，所以用 MSYS2 工具链。
      - name: 安装 MSYS2 MinGW 工具链
        if: steps.native.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja

      - name: 构建 esurfing.dll
        if: steps.native.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          ESURFING_C_DIR: ${{ github.workspace }}/esurfing_c
          ESURFING_BUILD_BASE: ${{ runner.temp }}/esf-build
        run: bash tool/build_native.sh windows

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 构建并打包
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          $out = 'build\windows\x64\runner\Release'
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$out\*" -DestinationPath "dist\esurfing-app-windows-x64-$version.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  # ── Android：用同一个 C 库版本编三个 ABI 的 so，再打 APK
  android:
    name: android apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 还原 libesurfing.so 缓存
        id: native
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: esf-so-${{ env.ESURFING_C_REF }}-${{ hashFiles('tool/build_native.sh') }}

      - name: 拉取 esurfing_c（绑定 tag）
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}
          ref: ${{ env.ESURFING_C_REF }}
          path: esurfing_c
          token: ${{ secrets.ESURFING_C_TOKEN || secrets.PAT_TOKEN }}
          ssh-key: ${{ secrets.ESURFING_C_DEPLOY_KEY }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # NDK 交给现成 action（r28c = 28.2.13676358，与 tool/build_native.sh 默认值一致）；
      # platform / build-tools 缺了由 Gradle 自动下载。
      - name: 安装 NDK
        if: steps.native.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false

      - name: 构建三个 ABI 的 libesurfing.so
        if: steps.native.outputs.cache-hit != 'true'
        env:
          ESURFING_C_DIR: ${{ github.workspace }}/esurfing_c
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash tool/build_native.sh android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 构建并打包 APK
        run: |
          flutter pub get
          flutter build apk --release
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/esurfing-app-android-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*.apk
          if-no-files-found: error

  # ── 打 tag 时把两个产物挂到 Release
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi

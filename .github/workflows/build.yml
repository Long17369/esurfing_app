name: build

# 触发：push dev/main、v* tag（出 Release）、PR、手动
on:
  push:
    # ci/** 分支用来单独验证 workflow 改动，验证完再并回 dev。
    branches: [dev, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      macos_only:
        description: 'Run only the macOS job'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  source:
    name: resolve native source
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: ref
        name: Require exact backend commit
        run: |
          ref="$(tr -d '\r\n' < tool/esurfing_c.ref)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected a full backend commit SHA"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Validate build number
        run: |
          build="$(sed -n 's/^version: .*+\([0-9][0-9]*\)$/\1/p' pubspec.yaml)"
          test -n "$build" || { echo "::error::pubspec version must include a numeric build number"; exit 1; }
          echo "App build number: $build"

  # ── 静态检查与单测（纯 Dart，跑一份就够）
  check:
    name: analyze & test
    if: ${{ inputs.macos_only != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Dart native hook compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libgtk-3-dev libx11-dev libxi-dev pkg-config
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # ── Windows x64：MinGW 编 esurfing.dll → flutter build windows → zip
  windows:
    name: windows x64
    if: ${{ inputs.macos_only != true }}
    needs: source
    runs-on: windows-latest
    env:
      ESURFING_C_REF: ${{ needs.source.outputs.ref }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # 精确提交与脚本共同决定原生缓存。
      - name: 还原 esurfing.dll 缓存
        id: native
        uses: actions/cache@v4
        with:
          path: packages/esurfing_native/windows
          key: esf-dll-${{ runner.os }}-${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}-${{ env.ESURFING_C_REF }}-${{ hashFiles('tool/build_native.sh') }}

      # 私有库鉴权：PAT 需要 Contents:Read-only；
      # Deploy Key 由 checkout 的 ssh-key 参数启用，repository 始终填 owner/repo。
      - name: 拉取 esurfing_c（精确提交）
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}
          ref: ${{ env.ESURFING_C_REF }}
          path: esurfing_c
          token: ${{ secrets.ESURFING_C_TOKEN || secrets.PAT_TOKEN }}
          ssh-key: ${{ secrets.ESURFING_C_DEPLOY_KEY }}
          submodules: recursive

      - name: Validate backend checkout
        if: steps.native.outputs.cache-hit != 'true'
        shell: bash
        run: test "$(git -C esurfing_c rev-parse HEAD)" = "$ESURFING_C_REF"

      # esurfing_c 是 C++23 + MinGW 专用链接参数，不能拿 MSVC 编，所以用 MSYS2 工具链。
      - name: 安装 MSYS2 MinGW 工具链
        if: steps.native.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-ninja

      - name: 构建 esurfing.dll
        if: steps.native.outputs.cache-hit != 'true'
        shell: msys2 {0}
        env:
          ESURFING_C_DIR: ${{ github.workspace }}/esurfing_c
          ESURFING_BUILD_BASE: ${{ runner.temp }}/esf-build
        run: bash tool/build_native.sh windows

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 构建并打包
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          $out = 'build\windows\x64\runner\Release'
          @("app_sha=$env:GITHUB_SHA", "backend_sha=$env:ESURFING_C_REF", "architecture=x86_64", "mode=release", "signing=unsigned") | Set-Content "$out\build-source.txt"
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(.+)$').Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$out\*" -DestinationPath "dist\esurfing-app-windows-x64-$version.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error

  # ── Android：用同一个 C 库版本编三个 ABI 的 so，再打 APK
  android:
    name: android apk
    if: ${{ inputs.macos_only != true }}
    needs: source
    runs-on: ubuntu-latest
    env:
      ESURFING_C_REF: ${{ needs.source.outputs.ref }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest 只有约 14 GB 可用磁盘，预装镜像里 dotnet/ghc/CodeQL/旧 NDK 等
      # 就占了 20 GB+。这套流程要 Flutter SDK + Gradle 缓存 + NDK + 三个 ABI 的 so
      # 与 APK 中间产物，磁盘一满 runner 连日志都写不出来（报错在 _diag 里，
      # GitHub 上表现为「job 失败且整段日志缺失」）。所以先把用不到的预装件删掉。
      - name: 腾出磁盘空间
        run: |
          echo "== before =="; df -h / /mnt 2>/dev/null | sed -n '1,5p'
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator
          docker image prune -af >/dev/null 2>&1 || true
          echo "== after =="; df -h / /mnt 2>/dev/null | sed -n '1,5p'

      - name: 还原 libesurfing.so 缓存
        id: native
        uses: actions/cache@v4
        with:
          path: android/app/src/main/jniLibs
          key: esf-so-${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}-${{ env.ESURFING_C_REF }}-${{ hashFiles('tool/build_native.sh') }}

      - name: 拉取 esurfing_c（精确提交）
        if: steps.native.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}
          ref: ${{ env.ESURFING_C_REF }}
          path: esurfing_c
          token: ${{ secrets.ESURFING_C_TOKEN || secrets.PAT_TOKEN }}
          ssh-key: ${{ secrets.ESURFING_C_DEPLOY_KEY }}
          submodules: recursive

      - name: Validate backend checkout
        if: steps.native.outputs.cache-hit != 'true'
        run: test "$(git -C esurfing_c rev-parse HEAD)" = "$ESURFING_C_REF"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      # NDK 交给现成 action（r28c = 28.2.13676358，与 tool/build_native.sh 默认值一致）；
      # platform / build-tools 缺了由 Gradle 自动下载。
      - name: 安装 NDK
        if: steps.native.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: false

      - name: 构建三个 ABI 的 libesurfing.so
        if: steps.native.outputs.cache-hit != 'true'
        env:
          ESURFING_C_DIR: ${{ github.workspace }}/esurfing_c
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: bash tool/build_native.sh android

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 还原 release 签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # 固定密钥：任何机器上打出来的包签名一致，否则换机器后升级装不上。
          # 只在打 tag 出 Release 时强制要求；日常 push/PR 缺 Secrets 就退回 debug 签名，
          # 免得没配密钥前整条流水线一直是红的。
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ]; then
            if [ "$REF_TYPE" = tag ]; then
              echo "::error::发版必须用固定密钥，但缺少 Secrets ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"
              echo "在本地运行 tool/android_signing.sh export 生成这两个值并填进仓库 Secrets"
              exit 1
            fi
            echo "::warning::缺少签名 Secrets，本次 APK 将使用 debug 签名（不影响发版流程之外的使用）"
            exit 0
          fi
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          {
            echo "storeFile=keystore/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=esurfing"
            echo "keyPassword=$STORE_PASSWORD"
          } > android/key.properties

      - name: 构建并打包 APK
        run: |
          df -h / | tail -1
          flutter pub get
          bash tool/package_android.sh
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          printf 'app_sha=%s\nbackend_sha=%s\narchitecture=arm64-v8a,armeabi-v7a,x86_64\nmode=release\n' "$GITHUB_SHA" "$ESURFING_C_REF" > dist/android-build-source.txt
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          for abi in all arm64-v8a armeabi-v7a x86_64; do
            apk="dist/esurfing-app-android-$version.apk"
            expected=$'arm64-v8a\narmeabi-v7a\nx86_64'
            if [[ "$abi" != all ]]; then
              apk="dist/esurfing-app-android-$abi-$version.apk"
              expected="$abi"
            fi
            actual="$(unzip -Z1 "$apk" | awk -F/ '$1 == "lib" && $3 ~ /\.so$/ {print $2}' | LC_ALL=C sort -u)"
            [[ "$actual" == "$expected" ]] || { echo "::error::$apk contains unexpected ABIs: $actual"; exit 1; }
            signature="$("$apksigner" verify --print-certs "$apk")"
            badging="$("${apksigner%/*}/aapt" dump badging "$apk")"
            [[ "$badging" == *"versionCode='${version##*+}'"* ]] || { echo "::error::$apk has the wrong version code"; exit 1; }
            if [[ "$abi" == all ]]; then
              printf '%s\n' "$signature" > dist/android-signing.txt
            else
              printf '%s\n' "$signature" | diff -u dist/android-signing.txt -
            fi
          done
          head -4 dist/android-signing.txt
          ls -l dist/
          df -h / | tail -1

      - name: Android lint and behavior tests
        working-directory: android
        shell: bash
        run: |
          log="$(mktemp)"
          trap 'rm -f "$log"' EXIT
          for delay in 20 60 0; do
            if ./gradlew :app:lintRelease :app:testDebugUnitTest --console=plain --max-workers=2 2>&1 | tee "$log"; then
              exit 0
            else
              status=$?
            fi
            if [[ "$delay" == 0 ]] || ! grep -Eq 'https://repo\.maven\.apache\.org/.*status code 429' "$log"; then
              exit "$status"
            fi
            echo "::warning::Maven Central rate limited Gradle; retrying in ${delay}s"
            sleep "$delay"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            build/app/reports/lint-results-*.*
            build/app/reports/tests/testDebugUnitTest/
            build/app/test-results/testDebugUnitTest/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-all
          path: dist/esurfing-app-android-[0-9]*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-arm64-v8a
          path: dist/esurfing-app-android-arm64-v8a-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-armeabi-v7a
          path: dist/esurfing-app-android-armeabi-v7a-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk-x86_64
          path: dist/esurfing-app-android-x86_64-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: android-build-metadata
          path: |
            dist/android-build-source.txt
            dist/android-signing.txt
          if-no-files-found: error

  macos:
    name: macOS universal
    needs: source
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ESURFING_C_REF: ${{ needs.source.outputs.ref }}
      ESURFING_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Verify macOS SDK
        run: |
          xcodebuild -version
          sdk="$(xcrun --sdk macosx --show-sdk-version)"
          test "${sdk%%.*}" -ge 26 || { echo "::error::connectivity_plus requires the macOS 26 SDK"; exit 1; }
      - name: Checkout exact backend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.ESURFING_C_REPO || format('{0}/esurfing_c', github.repository_owner) }}
          ref: ${{ env.ESURFING_C_REF }}
          path: esurfing_c
          token: ${{ secrets.ESURFING_C_TOKEN || secrets.PAT_TOKEN }}
          ssh-key: ${{ secrets.ESURFING_C_DEPLOY_KEY }}
          submodules: recursive
      - name: Validate backend checkout
        run: test "$(git -C esurfing_c rev-parse HEAD)" = "$ESURFING_C_REF"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Use CocoaPods for macOS plugins
        run: flutter config --no-enable-swift-package-manager
      - name: Restore universal macOS backend
        id: native
        uses: actions/cache@v4
        with:
          path: packages/esurfing_native/macos
          key: esf-macos-${{ runner.os }}-${{ env.ESURFING_C_REF }}-${{ hashFiles('tool/build_native.sh') }}
      - name: Build universal backend
        env:
          ESURFING_C_DIR: ${{ github.workspace }}/esurfing_c
          ESURFING_BUILD_BASE: ${{ runner.temp }}/esf-build
        if: steps.native.outputs.cache-hit != 'true'
        run: bash tool/build_native.sh macos
      - name: Validate universal macOS backend
        run: |
          test -f packages/esurfing_native/macos/libesurfing.dylib
          test "$(tr -d '\r\n' < packages/esurfing_native/macos/backend-sha.txt)" = "$ESURFING_C_REF"
      - name: Analyze and test on macOS
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: macOS plugin and desktop integration
        continue-on-error: true
        env:
          ARCHS: arm64
          ONLY_ACTIVE_ARCH: YES
        run: flutter test integration_test/macos_desktop_test.dart -d macos
      - name: Verify and package
        run: bash tool/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: dist/*.zip
          if-no-files-found: error

  # ── 仅 tag 发布；ci/** 分支只上传 Actions 产物，不创建 Release
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v') && inputs.macos_only != true
    needs: [source, check, windows, android, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release create --notes-from-tag 需要本地附注 tag，且不能与 --repo 同用。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: '@(android-apk-*|android-build-metadata|windows-x64|macos-universal)'
          merge-multiple: true
      - name: Validate release assets
        id: assets
        env:
          TAG: ${{ github.ref_name }}
          ESURFING_C_REF: ${{ needs.source.outputs.ref }}
        shell: bash
        run: |
          [[ "$(git cat-file -t "refs/tags/$TAG")" == tag &&
             "$(git rev-parse "refs/tags/$TAG^{commit}")" == "$GITHUB_SHA" &&
             "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] ||
            { echo "::error::Expected annotated tag $TAG at the workflow commit"; exit 1; }
          version="$(sed -n 's/^version: *//p' pubspec.yaml)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\+[0-9]+$ && "v${version%+*}" == "$TAG" ]] ||
            { echo "::error::pubspec version does not match release tag $TAG"; exit 1; }
          assets=(
            "dist/esurfing-app-android-$version.apk"
            "dist/esurfing-app-android-arm64-v8a-$version.apk"
            "dist/esurfing-app-android-armeabi-v7a-$version.apk"
            "dist/esurfing-app-android-x86_64-$version.apk"
            "dist/esurfing-app-windows-x64-$version.zip"
            "dist/esurfing-app-macos-universal-$version.zip"
            dist/android-build-source.txt
            dist/android-signing.txt
          )
          for asset in "${assets[@]}"; do
            [[ -f "$asset" && -s "$asset" ]] ||
              { echo "::error::Missing or empty release asset: $asset"; exit 1; }
          done
          grep -Fxq "app_sha=$GITHUB_SHA" dist/android-build-source.txt &&
            grep -Fxq "backend_sha=$ESURFING_C_REF" dist/android-build-source.txt ||
            { echo "::error::Android build sources do not match the release"; exit 1; }
          {
            echo 'files<<EOF'
            printf '%s\n' "${assets[@]}"
            echo EOF
          } >> "$GITHUB_OUTPUT"
      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          RELEASE_ASSETS: ${{ steps.assets.outputs.files }}
        shell: bash
        run: |
          mapfile -t assets <<< "$RELEASE_ASSETS"
          if response="$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"; then
            gh release upload "$TAG" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          elif [[ "${response%%$'\n'*}" =~ ^HTTP/[^[:space:]]+[[:space:]]+404([[:space:]]|$) ]]; then
            gh release create "$TAG" "${assets[@]}" --verify-tag --title "$TAG" --notes-from-tag
          else
            echo "::error::Could not determine whether release $TAG exists"
            exit 1
          fi
